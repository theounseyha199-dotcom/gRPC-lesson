plugins {
    id 'spring-boot-common-conventions'
}


repositories {
    mavenCentral()
    maven {
        name = 'buf'
        url 'https://buf.build/gen/maven'
    }
}
dependencies {
    // Serves the controller's HTTP/JSON endpoint.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'

    // Published Buf SDK supplies payment messages and gRPC client/server APIs.
    implementation('build.buf.gen:seyhacg_seyhagrpc_grpc_java:1.85.1.1.20261106032102.7131864c03ff')
    implementation('build.buf.gen:seyhacg_seyhagrpc_protocolbuffers_java:36.2.0.1.20261106032102.7131864c03ff')
}
